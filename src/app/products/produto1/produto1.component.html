<section class="py-0 mt-8">
    <div class="max-w-5xl mx-auto">
        <strong class="text-vinho-500 mb-4">Manual de instruções:</strong> Em breve.
    </div>
    <div class="max-w-5xl mx-auto">
        <div class="w-full md:w-3/3 mx-auto">
            <div *ngFor="let group of product?.groupsResource" class="mt-6">
                <strong>{{ group.name }}:</strong>
                <ul>
                    <li class="inline-block px-1 py-3" *ngFor="let resource of group.resources">
                        <a [href]="resource.url"
                            class="text-white bg-wine-500 hover:bg-wine-600 p-3 rounded-lg w-full text-center"
                            target="_blank">
                            {{ resource.name }}
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <div class="max-w-5xl mx-auto">
        <!-- Título -->
        <h2 class="text-4xl font-extrabold text-wine-700 mb-6 border-b-4 border-wine-500 pb-2 text-center py-5">
            Passo a passo da costura
        </h2>
        <!-- Descrição e vídeo do passo a passo -->
        <div class="w-full md:w-3/3 mx-auto">
            <p class="text-lg font-semibold text-gray-700 mb-4 text-center">
                Assista ao vídeo abaixo para entender os detalhes do processo.
            </p>
            <iframe width="100%" height="315" src="https://www.youtube.com/embed/PPV2on4pTE0?si=asew0pttAEQ6Ha9J"
                title="YouTube video player" frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>
    </div>

    <div class="max-w-5xl mx-auto">
        <!-- Título -->
        <h2 class="text-4xl font-extrabold text-wine-700 mb-6 border-b-4 border-wine-500 pb-2 text-center py-5">
            Como colar seu molde A4
        </h2>
        <!-- Descrição e vídeo do passo a passo -->
        <div class="w-full md:w-3/3 mx-auto">
            <p>Em breve</p>
        </div>
    </div>

    <div class="max-w-5xl mx-auto">
        <h2 class="text-4xl font-extrabold text-wine-700 mb-6 border-b-4 border-wine-500 pb-2 text-center py-5">
            Galeria de fotos
        </h2>
        <!-- Descrição e vídeo do passo a passo -->
        <div class="w-full md:w-3/3 mx-auto">
            <ul>

            </ul>
        </div>
    </div>
</section>
