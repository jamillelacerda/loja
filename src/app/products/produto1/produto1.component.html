<section class="py-0 mt-8">
    <div class="max-w-4xl mx-auto">
        <span class="text-white bg-wine-500 hover:bg-wine-600 p-3 rounded-lg w-full text-center">Manual de instruções</span>
    </div>
    <div class="max-w-5xl mx-auto">
        <div class="w-full md:w-3/3 mx-auto">
            <div *ngFor="let group of product?.groupsResource" class="mt-6">
                <strong>{{ group.name }}:</strong>
                <ul>
                    <li class="inline-block px-1 py-3" *ngFor="let resource of group.resources">
                        <a [href]="resource.url"
                            class="text-white bg-wine-500 hover:bg-wine-600 p-3 rounded-lg w-full text-center"
                            target="_blank">
                            {{ resource.name }}
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <div class="max-w-3xl mx-auto">
        <div class="w-full md:w-3/3 mx-auto">
            <!-- Título -->
            <h2 class="text-4xl font-extrabold text-wine-700 mb-6 border-b-4 border-wine-500 pb-2 text-center py-5">
                Passo a passo da costura
            </h2>
            <!-- Descrição e vídeo do passo a passo -->
            <div class="w-full md:w-3/3 mx-auto">
                <p class="text-lg font-semibold text-gray-700 mb-4 text-center">
                    Assista ao vídeo abaixo para entender os detalhes do processo.
                </p>
                <iframe width="100%" height="315" src="https://www.youtube.com/embed/PPV2on4pTE0?si=asew0pttAEQ6Ha9J"
                    title="YouTube video player" frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <div class="max-w-3xl mx-auto">
        <div class="w-full md:w-3/3 mx-auto">
            <!-- Título -->
            <h2 class="text-4xl font-extrabold text-wine-700 mb-6 border-b-4 border-wine-500 pb-2 text-center py-5">
                Como colar seu molde A4
            </h2>
            <!-- Descrição e vídeo do passo a passo -->
            <div class="w-full md:w-3/3 mx-auto">
                <p>Em breve</p>
            </div>
        </div>
    </div>

    <div class="max-w-5xl mx-auto">
        <div class="w-full md:w-3/3 mx-auto">
            <h2 class="text-4xl font-extrabold text-wine-700 mb-6 border-b-4 border-wine-500 pb-2 text-center py-5">
                Galeria de fotos
            </h2>
            <ul>
                <li class="inline-block px-1 py-3"><img
                        [src]="'assets/images/blusa-any/gallery/blusa-any-gallery_1.jpeg'" alt="Foto do Produto"
                        class="w-32 h-28 object-cover rounded shadow-lg cursor-pointer"
                        (click)="openModal('assets/images/blusa-any/gallery/blusa-any-gallery_1.jpeg')" />
                </li>
                <li class="inline-block px-1 py-3">
                    <img [src]="'assets/images/blusa-any/gallery/blusa-any-gallery_2.jpeg'" alt="Foto do Produto"
                        class="w-32 h-28 object-cover rounded shadow-lg cursor-pointer"
                        (click)="openModal('assets/images/blusa-any/gallery/blusa-any-gallery_2.jpeg')" />
                </li>
            </ul>
            <h3 class="text-2xl text-wine-700 mb-6 border-wine-500 pb-2 text-center py-2">
                Dicas de variações. Inspire-se.
            </h3>
            <ul>
                <li class="inline-block px-1 py-3"><img
                        [src]="'assets/images/blusa-any/gallery/blusa-any-variacao_1.jpeg'" alt="Foto do Produto"
                        class="w-32 h-28 object-cover rounded shadow-lg cursor-pointer"
                        (click)="openModal('assets/images/blusa-any/gallery/blusa-any-variacao_1.jpeg')" />
                </li>
                <li class="inline-block px-1 py-3"><img
                    [src]="'assets/images/blusa-any/gallery/blusa-any-variacao_2.jpeg'" alt="Foto do Produto"
                    class="w-32 h-28 object-cover rounded shadow-lg cursor-pointer"
                    (click)="openModal('assets/images/blusa-any/gallery/blusa-any-variacao_2.jpeg')" />
                </li>
                <li class="inline-block px-1 py-3"><img
                    [src]="'assets/images/blusa-any/gallery/blusa-any-variacao_3.jpeg'" alt="Foto do Produto"
                    class="w-32 h-28 object-cover rounded shadow-lg cursor-pointer"
                    (click)="openModal('assets/images/blusa-any/gallery/blusa-any-variacao_3.jpeg')" />
                </li>
                <li class="inline-block px-1 py-3"><img
                    [src]="'assets/images/blusa-any/gallery/blusa-any-variacao_4.jpeg'" alt="Foto do Produto"
                    class="w-32 h-28 object-cover rounded shadow-lg cursor-pointer"
                    (click)="openModal('assets/images/blusa-any/gallery/blusa-any-variacao_4.jpeg')" />
                </li>
            </ul>
        </div>
    </div>

    <!-- Modal -->
    <div *ngIf="selectedImage"  (click)="closeModal()" class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50">
        <div class="relative bg-white p-4 rounded shadow-lg max-w-full">
            <button class="absolute top-2 right-2 text-red-600 text-xl" (click)="closeModal()">×</button>
            <img [src]="selectedImage" alt="Imagem Ampliada" class="max-w-[70vw] max-h-screen object-contain rounded">
        </div>
    </div>
</section>
