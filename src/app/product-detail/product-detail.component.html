<section class="min-h-screen bg-beige-200 p-8 flex items-center justify-center">
  <div class="max-w-4xl w-full mx-auto bg-white p-6 rounded shadow">
    <h2 class="text-3xl font-bold text-vinho-600 mb-4 text-center">{{ product?.name }}</h2>

    <div class="flex flex-col md:flex-row gap-8">
      <!-- Imagem do produto -->
      <div class="w-full md:w-1/3">
        <img [src]="product?.image" [alt]="product?.name" class="w-full rounded shadow-lg">
      </div>

      <!-- Detalhes do produto -->
      <div class="w-full md:w-2/3">
        <!-- <p class="text-xl font-bold text-vinho-500">{{ product?.price == 0 ? "" : (product?.price | number:'1.2-2') }}</p> -->
        <div *ngIf="product?.groupsResource?.length" class="mt-8">
          <h3 class="text-2xl font-semibold text-vinho-600">Detalhes:</h3>
          <ul class="list-disc pl-6 mt-4">
            <li *ngFor="let detalhe of product?.details">{{detalhe}};</li>
          </ul>
        </div>
      </div>
    </div>
    <div class="flex gap-8 mt-8">
      <app-produto1></app-produto1>
    </div>
  </div>
</section>
